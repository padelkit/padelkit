name: Deploy Docs

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            HOOK_URL="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            TARGET_ENV="Production (main)"
          else
            HOOK_URL="${{ secrets.VERCEL_PREVIEW_DEPLOY_HOOK_URL }}"
            TARGET_ENV="Preview (develop)"
          fi

          if [ -z "$HOOK_URL" ]; then
            echo "Error: Target Deploy Hook secret for $TARGET_ENV is empty!"
            exit 1
          fi

          echo "Triggering Vercel deployment for $TARGET_ENV..."
          curl --fail-with-body -sS -X POST "$HOOK_URL"
          echo ""
