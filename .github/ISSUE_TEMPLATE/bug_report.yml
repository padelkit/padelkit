name: 🐛 Bug Report
description: Report a bug in PadelKit's geometry, camera calibration, physics engine, visualizer, or scoring.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example
      description: Provide a minimal Python snippet that reproduces the issue.
      placeholder: |
        from padelkit import Court, Camera
        court = Court.fip_standard()
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead (including tracebacks)?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment (PadelKit version, Python version, OS)
      placeholder: "padelkit 0.1.0, Python 3.12, Ubuntu 24.04"
    validations:
      required: true
