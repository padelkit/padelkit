<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto" role="img">
  <title>PadelKit 9D Ball Aerodynamics Free-Body Forces</title>
  <desc>Free-body diagram of a spinning padel ball showing linear velocity, angular velocity spin vector, quadratic drag, gravity, and Spindt Magnus lift.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
  </defs>
  <rect x="0.00" y="0.00" width="900.00" height="420.00" fill="#090d16" stroke="#1e293b" stroke-width="1.50" rx="14.00" />
  <text x="28.00" y="28.00" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.00" font-weight="700" text-anchor="start" dominant-baseline="middle">9D Ball State &amp; Aerodynamic Forces (padelkit.physics)</text>
  <text x="28.00" y="48.00" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="400" text-anchor="start" dominant-baseline="middle">State = [x, y, z, vx, vy, vz, wx, wy, wz]  |  F_total = m*g + F_drag(Cd) + F_magnus(Cl_Spindt)</text>
  <rect x="24.00" y="64.00" width="520.00" height="332.00" fill="#0f172a" stroke="#1e293b" stroke-width="1.00" rx="10.00" />
  <rect x="560.00" y="64.00" width="316.00" height="332.00" fill="#0f172a" stroke="#1e293b" stroke-width="1.00" rx="10.00" />
  <line x1="70.00" y1="152.00" x2="450.00" y2="152.00" stroke="#1e293b" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70.00" y1="178.00" x2="450.00" y2="178.00" stroke="#1e293b" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70.00" y1="262.00" x2="450.00" y2="262.00" stroke="#1e293b" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70.00" y1="288.00" x2="450.00" y2="288.00" stroke="#1e293b" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="6 4" />
  <circle cx="260.00" cy="220.00" r="48.00" fill="#111c2d" stroke="#fbbf24" stroke-width="2.50" />
  <path d="M 226.00 186.00 Q 278.00 220.00 226.00 254.00" fill="none" stroke="#fbbf24" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" />
  <path d="M 196.00 202.00 A 66 66 0 0 1 278.00 156.00" fill="none" stroke="#fbbf24" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tertiary)" />
  <rect x="166.80" y="146.50" width="102.40" height="19.00" fill="#090d16" stroke="#fbbf24" stroke-width="1.50" rx="9.50" />
  <text x="218.00" y="156.50" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">ω (Spin rad/s)</text>
  <line x1="260.00" y1="220.00" x2="410.00" y2="188.00" stroke="#34d399" stroke-width="2.80" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <line x1="410.00" y1="188.00" x2="420.00" y2="170.00" stroke="#34d399" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="410.00" cy="188.00" r="3.20" fill="#34d399" stroke="#0f172a" stroke-width="1.50" />
  <rect x="362.20" y="160.50" width="115.60" height="19.00" fill="#090d16" stroke="#34d399" stroke-width="1.50" rx="9.50" />
  <text x="420.00" y="170.50" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">v (Velocity m/s)</text>
  <line x1="260.00" y1="220.00" x2="125.00" y2="249.00" stroke="#fb7185" stroke-width="2.60" stroke-linecap="round" marker-end="url(#arrow-danger)" />
  <line x1="125.00" y1="249.00" x2="115.00" y2="271.00" stroke="#fb7185" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="125.00" cy="249.00" r="3.20" fill="#fb7185" stroke="#0f172a" stroke-width="1.50" />
  <rect x="70.40" y="261.50" width="89.20" height="19.00" fill="#090d16" stroke="#fb7185" stroke-width="1.50" rx="9.50" />
  <text x="115.00" y="271.50" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_drag (-v̂)</text>
  <line x1="260.00" y1="220.00" x2="260.00" y2="338.00" stroke="#f8fafc" stroke-width="2.40" stroke-linecap="round" marker-end="url(#arrow-fg)" />
  <line x1="260.00" y1="338.00" x2="324.00" y2="338.00" stroke="#f8fafc" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="260.00" cy="338.00" r="3.20" fill="#f8fafc" stroke="#0f172a" stroke-width="1.50" />
  <rect x="272.80" y="328.50" width="102.40" height="19.00" fill="#090d16" stroke="#f8fafc" stroke-width="1.50" rx="9.50" />
  <text x="324.00" y="338.50" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_g = m·g (-Z)</text>
  <line x1="260.00" y1="220.00" x2="234.00" y2="98.00" stroke="#38bdf8" stroke-width="2.80" stroke-linecap="round" marker-end="url(#arrow-secondary)" />
  <line x1="234.00" y1="98.00" x2="290.00" y2="90.00" stroke="#38bdf8" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="234.00" cy="98.00" r="3.20" fill="#38bdf8" stroke="#0f172a" stroke-width="1.50" />
  <rect x="232.20" y="80.50" width="115.60" height="19.00" fill="#090d16" stroke="#38bdf8" stroke-width="1.50" rx="9.50" />
  <text x="290.00" y="90.50" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_magnus ∝ ω × v</text>
  <text x="578.00" y="96.00" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="700" text-anchor="start" dominant-baseline="middle">1. Quadratic Felt Drag</text>
  <text x="578.00" y="124.50" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">Cd = Cd0 + fuzz_factor (0.507 + 0.04)</text>
  <text x="578.00" y="153.00" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">F_drag = -½ ρ A Cd |v| v</text>
  <text x="578.00" y="181.50" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="700" text-anchor="start" dominant-baseline="middle">2. Spindt Non-Linear Magnus Lift</text>
  <text x="578.00" y="210.00" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">Spin Ratio S = (r · |ω|) / |v|</text>
  <text x="578.00" y="238.50" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">Cl = 1 / (2.022 + 0.981 / S)</text>
  <text x="578.00" y="267.00" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">F_magnus = ½ ρ A Cl |v|² (ω × v)/|ω × v|</text>
  <text x="578.00" y="295.50" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="700" text-anchor="start" dominant-baseline="middle">3. Sample BallState.from_shot()</text>
  <text x="578.00" y="324.00" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">Speed: 80.2 km/h | Spin: 2148 RPM</text>
  <text x="578.00" y="352.50" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.20" font-weight="500" text-anchor="start" dominant-baseline="middle">ω = (-220, 0, -47) rad/s</text>
</svg>
