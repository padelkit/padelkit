<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto" role="img">
  <title>PadelKit 9D Ball Aerodynamics Free-Body Forces</title>
  <desc>Free-body diagram of a spinning padel ball showing linear velocity, angular velocity spin vector, quadratic drag, gravity, and Spindt Magnus lift.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#090d16" stroke="#1e293b" stroke-width="1.5" rx="14" />
  <text x="28" y="27" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle">9D Ball State &amp; Aerodynamic Forces (padelkit.physics)</text>
  <text x="28" y="47" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">State = [x, y, z, vx, vy, vz, wx, wy, wz]  |  F_total = m*g + F_drag(Cd) + F_magnus(Cl_Spindt)</text>
  <rect x="24" y="64" width="520" height="332" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="10" />
  <rect x="560" y="64" width="316" height="332" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="10" />
  <line x1="70" y1="152" x2="450" y2="152" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70" y1="178" x2="450" y2="178" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70" y1="262" x2="450" y2="262" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" />
  <line x1="70" y1="288" x2="450" y2="288" stroke="#1e293b" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="6 4" />
  <circle cx="260" cy="220" r="48" fill="#111c2d" stroke="#fbbf24" stroke-width="2.5" />
  <path d="M 226 186 Q 278 220 226 254" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" />
  <path d="M 196 202 A 66 66 0 0 1 278 156" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tertiary)" />
  <rect x="168.2" y="147" width="99.6" height="18" fill="#090d16" stroke="#fbbf24" stroke-width="1.4" rx="9" />
  <text x="218" y="156.5" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">ω (Spin rad/s)</text>
  <line x1="260" y1="220" x2="410" y2="188" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <line x1="410" y1="188" x2="420" y2="170" stroke="#34d399" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="410" cy="188" r="3.2" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
  <rect x="363.8" y="161" width="112.4" height="18" fill="#090d16" stroke="#34d399" stroke-width="1.4" rx="9" />
  <text x="420" y="170.5" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">v (Velocity m/s)</text>
  <line x1="260" y1="220" x2="125" y2="249" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-danger)" />
  <line x1="125" y1="249" x2="115" y2="271" stroke="#fb7185" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="125" cy="249" r="3.2" fill="#fb7185" stroke="#0f172a" stroke-width="1.5" />
  <rect x="71.6" y="262" width="86.8" height="18" fill="#090d16" stroke="#fb7185" stroke-width="1.4" rx="9" />
  <text x="115" y="271.5" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_drag (-v̂)</text>
  <line x1="260" y1="220" x2="260" y2="338" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-fg)" />
  <line x1="260" y1="338" x2="324" y2="338" stroke="#f8fafc" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="260" cy="338" r="3.2" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
  <rect x="274.2" y="329" width="99.6" height="18" fill="#090d16" stroke="#f8fafc" stroke-width="1.4" rx="9" />
  <text x="324" y="338.5" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_g = m·g (-Z)</text>
  <line x1="260" y1="220" x2="234" y2="98" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-secondary)" />
  <line x1="234" y1="98" x2="290" y2="90" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="234" cy="98" r="3.2" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <rect x="233.8" y="81" width="112.4" height="18" fill="#090d16" stroke="#38bdf8" stroke-width="1.4" rx="9" />
  <text x="290" y="90.5" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_magnus ∝ ω × v</text>
  <text x="578" y="96" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">1. Quadratic Felt Drag</text>
  <text x="578" y="124.5" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">Cd = Cd0 + fuzz_factor (0.507 + 0.04)</text>
  <text x="578" y="153" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">F_drag = -½ ρ A Cd |v| v</text>
  <text x="578" y="181.5" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">2. Spindt Non-Linear Magnus Lift</text>
  <text x="578" y="210" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">Spin Ratio S = (r · |ω|) / |v|</text>
  <text x="578" y="238.5" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">Cl = 1 / (2.022 + 0.981 / S)</text>
  <text x="578" y="267" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">F_magnus = ½ ρ A Cl |v|² (ω × v)/|ω × v|</text>
  <text x="578" y="295.5" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">3. Sample BallState.from_shot()</text>
  <text x="578" y="324" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">Speed: 80.2 km/h | Spin: 2148 RPM</text>
  <text x="578" y="352.5" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="500" text-anchor="start" dominant-baseline="middle">ω = (-220, 0, -47) rad/s</text>
</svg>
