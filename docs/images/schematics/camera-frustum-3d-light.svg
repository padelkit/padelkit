  <rect x="618.00" y="64.00" width="318.00" height="412.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.00" rx="10.00" />
  <polygon points="392.83,455.78 563.19,330.03 226.93,210.96 57.52,257.82" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.80" stroke-linejoin="round" />
  <line x1="314.00" y1="409.24" x2="491.30" y2="304.57" stroke="#0f172a" stroke-width="1.40" stroke-linecap="round" />
