  <line x1="653.17" y1="242.94" x2="471.77" y2="338.50" stroke="#0284c7" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.75" />
  <line x1="653.17" y1="242.94" x2="30.53" y2="616.96" stroke="#0284c7" stroke-width="1.20" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.75" />
  <polygon points="-125.88,176.76 410.81,89.89 471.77,338.50 30.53,616.96" fill="#0284c7" stroke="#0284c7" stroke-width="1.40" stroke-linejoin="round" fill-opacity="0.08" stroke-dasharray="5 3" />
  <polygon points="527.68,232.28 588.96,202.39 603.34,269.19 544.99,307.92" fill="#0284c7" stroke="#0284c7" stroke-width="2.00" stroke-linejoin="round" fill-opacity="0.24" />
  <line x1="653.17" y1="242.94" x2="280.23" y2="289.62" stroke="#d97706" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arrow-tertiary)" />
  <line x1="653.17" y1="242.94" x2="653.17" y2="220.94" stroke="#0284c7" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="653.17" cy="242.94" r="3.20" fill="#0284c7" stroke="#ffffff" stroke-width="1.50" />
  <rect x="601.97" y="211.44" width="102.40" height="19.00" fill="#ffffff" stroke="#0284c7" stroke-width="1.50" rx="9.50" />
  <text x="653.17" y="221.44" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">broadcast_near</text>
  <line x1="280.23" y1="289.62" x2="332.23" y2="305.62" stroke="#059669" stroke-width="1.10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <circle cx="280.23" cy="289.62" r="3.20" fill="#059669" stroke="#ffffff" stroke-width="1.50" />
  <rect x="284.33" y="296.12" width="95.80" height="19.00" fill="#ffffff" stroke="#059669" stroke-width="1.50" rx="9.50" />
  <text x="332.23" y="306.12" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">World (0,0,0)</text>
  <circle cx="273.15" cy="-24.85" r="4.50" fill="#d97706" stroke="#ffffff" stroke-width="1.50" />
  <text x="281.15" y="-30.85" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">overhead_zenith</text>
  <circle cx="398.40" cy="332.84" r="4.50" fill="#d97706" stroke="#ffffff" stroke-width="1.50" />
  <text x="406.40" y="326.84" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">corner_near_left</text>
  <circle cx="372.14" cy="205.09" r="4.50" fill="#d97706" stroke="#ffffff" stroke-width="1.50" />
  <text x="380.14" y="199.09" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">side_net_right</text>
  <rect x="636.00" y="106.00" width="282.00" height="92.00" fill="#f8fafc" stroke="#059669" stroke-width="1.50" rx="8.00" />
  <text x="650.00" y="130.00" fill="#059669" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">1. World Frame (Meters)</text>
  <text x="650.00" y="152.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="start" dominant-baseline="middle">(X, Y, Z) at Court Net Center</text>
  <text x="650.00" y="174.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">+X: Right  |  +Y: Far Wall  |  +Z: Up</text>
  <rect x="636.00" y="228.00" width="282.00" height="92.00" fill="#f8fafc" stroke="#0284c7" stroke-width="1.50" rx="8.00" />
  <text x="650.00" y="252.00" fill="#0284c7" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">2. Camera Frame (OpenCV vs OpenGL)</text>
  <text x="650.00" y="274.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="start" dominant-baseline="middle">Extrinsics: R (3×3), t = -R @ C</text>
  <text x="650.00" y="296.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">OpenCV: +X right, +Y down, +Z forward</text>
  <rect x="636.00" y="350.00" width="282.00" height="92.00" fill="#f8fafc" stroke="#d97706" stroke-width="1.50" rx="8.00" />
  <text x="650.00" y="374.00" fill="#d97706" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">3. Image Sensor Plane (Pixels)</text>
  <text x="650.00" y="396.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="start" dominant-baseline="middle">Intrinsics Matrix K (fx, fy, cx, cy)</text>
  <text x="650.00" y="418.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">u = fx*(X_c/Z_c)+cx, v = fy*(Y_c/Z_c)+cy</text>
</svg>
