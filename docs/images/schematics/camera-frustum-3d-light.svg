<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="auto" role="img">
  <title>PadelKit 3D Camera Frustum &amp; Coordinate Frames</title>
  <desc>3D perspective schematic of Camera.broadcast_near() frustum pyramid and World/Camera/Sensor coordinate frames.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>
  <rect x="0.00" y="0.00" width="960.00" height="500.00" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.50" rx="14.00" />
  <text x="28.00" y="28.00" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.00" font-weight="700" text-anchor="start" dominant-baseline="middle">Projective Camera Frustum &amp; Coordinate Systems (padelkit.camera)</text>
  <text x="28.00" y="48.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="400" text-anchor="start" dominant-baseline="middle">1. World (X, Y, Z)  -&gt;  2. OpenCV Camera (+X right, +Y down, +Z forward)  -&gt;  3. Sensor Pixels (u, v)</text>
