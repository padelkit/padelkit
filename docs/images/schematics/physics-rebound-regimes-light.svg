<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" role="img">
  <title>PadelKit Impulse Contact Rebound Regimes (ContactRegime)</title>
  <desc>Comparison of ContactRegime.SLIDING on glass, ContactRegime.ROLLING on sandy turf, and ContactRegime.DAMPED on net/fence.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="14" />
  <text x="28" y="27" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle">Impulse Contact Dynamics: Sliding vs. Rolling vs. Damped (ContactRegime)</text>
  <text x="28" y="47" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">Analytical Coulomb friction threshold μ_crit determines tangential slip vs. surface grip during impact</text>
  <rect x="24" y="64" width="288" height="292" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <text x="40" y="88" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle">1. ContactRegime.SLIDING</text>
  <text x="40" y="106" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="middle">Tempered Glass (μ = 0.20 &lt; μ_crit)</text>
  <text x="40" y="124" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">High tangential slip; spin slides smoothly</text>
  <rect x="44" y="255" width="248" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6" rx="3" />
  <line x1="168" y1="255" x2="168" y2="177" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="180" y="183" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="93" y1="175" x2="160" y2="245" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="101" y="165" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="176" y1="245" x2="253" y2="210" stroke="#0284c7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-secondary)" />
  <text x="243" y="198" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="168" cy="243" r="11" fill="#f8fafc" stroke="#0284c7" stroke-width="2.2" />
  <rect x="40" y="296" width="256" height="42" fill="#f8fafc" stroke="#0284c7" stroke-width="1.2" rx="6" />
  <text x="168" y="317" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_t' = v_t - s·μ·(1 + e)·v_n</text>
  <rect x="336" y="64" width="288" height="292" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <text x="352" y="88" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle">2. ContactRegime.ROLLING</text>
  <text x="352" y="106" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="middle">Sandy Turf Floor (μ = 0.55 ≥ μ_crit)</text>
  <text x="352" y="124" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Full surface grip; backspin bites low &amp; slow</text>
  <rect x="356" y="255" width="248" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6" rx="3" />
  <line x1="480" y1="255" x2="480" y2="177" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="492" y="183" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="395" y1="165" x2="472" y2="245" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="403" y="155" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="488" y1="245" x2="560" y2="232" stroke="#059669" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <text x="550" y="220" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="480" cy="243" r="11" fill="#f8fafc" stroke="#059669" stroke-width="2.2" />
  <rect x="352" y="296" width="256" height="42" fill="#f8fafc" stroke="#059669" stroke-width="1.2" rx="6" />
  <text x="480" y="317" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_t' = 5/7·v_t + 2/7·r·(ω × n)</text>
  <rect x="648" y="64" width="288" height="292" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <text x="664" y="88" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="middle">3. ContactRegime.DAMPED</text>
  <text x="664" y="106" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" text-anchor="start" dominant-baseline="middle">Net &amp; Metallic Fence (e = 0.22 / 0.45)</text>
  <text x="664" y="124" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Viscoelastic mesh energy absorption</text>
  <rect x="668" y="255" width="248" height="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.6" rx="3" />
  <line x1="792" y1="255" x2="792" y2="177" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="804" y="183" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="707" y1="165" x2="784" y2="245" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="715" y="155" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="800" y1="245" x2="834" y2="240" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-danger)" />
  <text x="824" y="228" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="792" cy="243" r="11" fill="#f8fafc" stroke="#e11d48" stroke-width="2.2" />
  <rect x="664" y="296" width="256" height="42" fill="#f8fafc" stroke="#e11d48" stroke-width="1.2" rx="6" />
  <text x="792" y="317" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_n' = -e_mesh · v_n  (Deadened rebound)</text>
</svg>
