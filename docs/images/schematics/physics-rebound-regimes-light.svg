<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" role="img">
  <title>PadelKit Impulse Contact Rebound Regimes (ContactRegime)</title>
  <desc>Comparison of ContactRegime.SLIDING on glass, ContactRegime.ROLLING on sandy turf, and ContactRegime.DAMPED on net/fence.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>
  <rect x="0.00" y="0.00" width="960.00" height="380.00" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.50" rx="14.00" />
  <text x="28.00" y="28.00" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15.00" font-weight="700" text-anchor="start" dominant-baseline="middle">Impulse Contact Dynamics: Sliding vs. Rolling vs. Damped (ContactRegime)</text>
  <text x="28.00" y="48.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="400" text-anchor="start" dominant-baseline="middle">Analytical Coulomb friction threshold μ_crit determines tangential slip vs. surface grip during impact</text>
  <rect x="24.00" y="64.00" width="288.00" height="292.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.00" rx="10.00" />
  <text x="40.00" y="88.00" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">1. ContactRegime.SLIDING</text>
  <text x="40.00" y="106.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="600" text-anchor="start" dominant-baseline="middle">Tempered Glass (μ = 0.20 &lt; μ_crit)</text>
  <text x="40.00" y="124.00" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">High tangential slip; spin slides smoothly</text>
  <rect x="44.00" y="255.00" width="248.00" height="14.00" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.60" rx="3.00" />
  <line x1="168.00" y1="255.00" x2="168.00" y2="177.00" stroke="#475569" stroke-width="1.30" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="180.00" y="183.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="93.00" y1="175.00" x2="160.00" y2="245.00" stroke="#475569" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="101.00" y="165.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="176.00" y1="245.00" x2="253.00" y2="210.00" stroke="#0284c7" stroke-width="2.40" stroke-linecap="round" marker-end="url(#arrow-secondary)" />
  <text x="243.00" y="198.00" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.50" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="168.00" cy="243.00" r="11.00" fill="#f8fafc" stroke="#0284c7" stroke-width="2.20" />
  <rect x="40.00" y="296.00" width="256.00" height="42.00" fill="#f8fafc" stroke="#0284c7" stroke-width="1.20" rx="6.00" />
  <text x="168.00" y="317.00" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_t' = v_t - s·μ·(1 + e)·v_n</text>
  <rect x="336.00" y="64.00" width="288.00" height="292.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.00" rx="10.00" />
  <text x="352.00" y="88.00" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">2. ContactRegime.ROLLING</text>
  <text x="352.00" y="106.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="600" text-anchor="start" dominant-baseline="middle">Sandy Turf Floor (μ = 0.55 ≥ μ_crit)</text>
  <text x="352.00" y="124.00" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">Full surface grip; backspin bites low &amp; slow</text>
  <rect x="356.00" y="255.00" width="248.00" height="14.00" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.60" rx="3.00" />
  <line x1="480.00" y1="255.00" x2="480.00" y2="177.00" stroke="#475569" stroke-width="1.30" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="492.00" y="183.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="395.00" y1="165.00" x2="472.00" y2="245.00" stroke="#475569" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="403.00" y="155.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="488.00" y1="245.00" x2="560.00" y2="232.00" stroke="#059669" stroke-width="2.40" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <text x="550.00" y="220.00" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.50" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="480.00" cy="243.00" r="11.00" fill="#f8fafc" stroke="#059669" stroke-width="2.20" />
  <rect x="352.00" y="296.00" width="256.00" height="42.00" fill="#f8fafc" stroke="#059669" stroke-width="1.20" rx="6.00" />
  <text x="480.00" y="317.00" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_t' = 5/7·v_t + 2/7·r·(ω × n)</text>
  <rect x="648.00" y="64.00" width="288.00" height="292.00" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.00" rx="10.00" />
  <text x="664.00" y="88.00" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.50" font-weight="700" text-anchor="start" dominant-baseline="middle">3. ContactRegime.DAMPED</text>
  <text x="664.00" y="106.00" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="600" text-anchor="start" dominant-baseline="middle">Net &amp; Metallic Fence (e = 0.22 / 0.45)</text>
  <text x="664.00" y="124.00" fill="#475569" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.50" font-weight="500" text-anchor="start" dominant-baseline="middle">Viscoelastic mesh energy absorption</text>
  <rect x="668.00" y="255.00" width="248.00" height="14.00" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.60" rx="3.00" />
  <line x1="792.00" y1="255.00" x2="792.00" y2="177.00" stroke="#475569" stroke-width="1.30" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#arrow-muted)" />
  <text x="804.00" y="183.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">n̂</text>
  <line x1="707.00" y1="165.00" x2="784.00" y2="245.00" stroke="#475569" stroke-width="2.00" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <text x="715.00" y="155.00" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="500" text-anchor="middle" dominant-baseline="middle">v_in</text>
  <line x1="800.00" y1="245.00" x2="834.00" y2="240.00" stroke="#e11d48" stroke-width="2.40" stroke-linecap="round" marker-end="url(#arrow-danger)" />
  <text x="824.00" y="228.00" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.50" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_out</text>
  <circle cx="792.00" cy="243.00" r="11.00" fill="#f8fafc" stroke="#e11d48" stroke-width="2.20" />
  <rect x="664.00" y="296.00" width="256.00" height="42.00" fill="#f8fafc" stroke="#e11d48" stroke-width="1.20" rx="6.00" />
  <text x="792.00" y="317.00" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.00" font-weight="700" text-anchor="middle" dominant-baseline="middle">v_n' = -e_mesh · v_n  (Deadened rebound)</text>
</svg>
