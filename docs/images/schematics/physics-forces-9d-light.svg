<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="auto" role="img">
  <title>PadelKit 9D Ball Aerodynamics Free-Body Forces</title>
  <desc>Free-body diagram of a spinning padel ball showing linear velocity, angular velocity spin vector, quadratic drag, gravity, and Spindt Magnus lift.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
    <radialGradient id="ball-grad-light" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="55%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="14" />
  <text x="28" y="27" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle">9D Ball State &amp; Aerodynamic Forces (padelkit.physics)</text>
  <text x="28" y="47" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">State = [x, y, z, vx, vy, vz, wx, wy, wz]  |  F_total = m*g + F_drag(Cd) + F_magnus(Cl_Spindt)</text>
  <rect x="24" y="64" width="520" height="332" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <rect x="560" y="64" width="316" height="332" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <path d="M 440 180 C 350 170, 285 140, 72 184" fill="none" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" opacity="0.5" marker-end="url(#arrow-muted)" />
  <path d="M 440 152 C 355 144, 290 118, 72 158" fill="none" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" opacity="0.5" marker-end="url(#arrow-muted)" />
  <path d="M 440 272 C 345 286, 280 302, 72 296" fill="none" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" opacity="0.5" marker-end="url(#arrow-muted)" />
  <path d="M 440 304 C 345 316, 280 330, 72 324" fill="none" stroke="#475569" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" opacity="0.5" marker-end="url(#arrow-muted)" />
  <text x="118" y="130" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.8" font-weight="600" text-anchor="middle" dominant-baseline="middle">-ΔP (Low Pressure)</text>
  <text x="118" y="344" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.8" font-weight="600" text-anchor="middle" dominant-baseline="middle">+ΔP (High Pressure)</text>
  <circle cx="264" cy="228" r="46" fill="url(#ball-grad-light)" stroke="#d97706" stroke-width="2.2" />
  <path d="M 234 194 Q 280 228 234 262" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" opacity="0.8" />
  <path d="M 318 202 A 60 60 0 0 0 273 169" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-tertiary)" />
  <line x1="300" y1="180" x2="346" y2="156" stroke="#d97706" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="300" cy="180" r="3.2" fill="#d97706" stroke="#ffffff" stroke-width="1.5" />
  <rect x="302.6" y="147" width="86.8" height="18" fill="#ffffff" stroke="#d97706" stroke-width="1.4" rx="9" />
  <text x="346" y="156.5" fill="#d97706" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">ω (Backspin)</text>
  <line x1="264" y1="228" x2="414" y2="196" stroke="#059669" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <line x1="414" y1="196" x2="432" y2="176" stroke="#059669" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="414" cy="196" r="3.2" fill="#059669" stroke="#ffffff" stroke-width="1.5" />
  <rect x="388.6" y="167" width="86.8" height="18" fill="#ffffff" stroke="#059669" stroke-width="1.4" rx="9" />
  <text x="432" y="176.5" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">v (Velocity)</text>
  <line x1="264" y1="228" x2="129" y2="257" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-danger)" />
  <line x1="129" y1="257" x2="129" y2="279" stroke="#e11d48" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="129" cy="257" r="3.2" fill="#e11d48" stroke="#ffffff" stroke-width="1.5" />
  <rect x="85.6" y="270" width="86.8" height="18" fill="#ffffff" stroke="#e11d48" stroke-width="1.4" rx="9" />
  <text x="129" y="279.5" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_drag (-v̂)</text>
  <line x1="264" y1="228" x2="264" y2="342" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrow-fg)" />
  <line x1="264" y1="342" x2="330" y2="342" stroke="#0f172a" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="264" cy="342" r="3.2" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />
  <rect x="280.2" y="333" width="99.6" height="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" rx="9" />
  <text x="330" y="342.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_g = m·g (-Z)</text>
  <line x1="264" y1="228" x2="238" y2="108" stroke="#0284c7" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arrow-secondary)" />
  <line x1="238" y1="108" x2="182" y2="96" stroke="#0284c7" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="238" cy="108" r="3.2" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" />
  <rect x="125.8" y="87" width="112.4" height="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.4" rx="9" />
  <text x="182" y="96.5" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">F_magnus ∝ ω × v</text>
  <circle cx="264" cy="228" r="4" fill="#0f172a" stroke="#ffffff" stroke-width="1.5" />
  <text x="578" y="94" fill="#e11d48" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="middle">1. Quadratic Felt Drag</text>
  <text x="578" y="123" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">Cd = 0.50 + 0.15 · fuzz_factor</text>
  <text x="578" y="152" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">F_drag = -½ ρ A Cd |v| v</text>
  <text x="578" y="181" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="middle">2. Spindt Non-Linear Magnus Lift</text>
  <text x="578" y="210" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">Spin Ratio S = (R · |ω|) / |v|</text>
  <text x="578" y="239" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">Cl = 1 / (2.32 + 0.4 / (S + 0.1))</text>
  <text x="578" y="268" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">F_magnus = ½ ρ A Cl |v|² (ω̂ × v̂)</text>
  <text x="578" y="297" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="start" dominant-baseline="middle">3. Sample Backspin BallState</text>
  <text x="578" y="326" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">Speed: 73.6 km/h | Spin: -1800 RPM</text>
  <text x="578" y="355" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="500" text-anchor="start" dominant-baseline="middle">ω = (+188, 0, 0) rad/s</text>
</svg>
