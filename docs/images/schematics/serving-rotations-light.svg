  <line x1="106" y1="295.6" x2="363.2" y2="176.8" stroke="#059669" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <rect x="72.2" y="286.6" width="67.6" height="18" fill="#ffffff" stroke="#059669" stroke-width="1.4" rx="9" />
  <text x="106" y="296.1" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">S (right)</text>
  <rect x="382.2" y="163.4" width="67.6" height="18" fill="#ffffff" stroke="#059669" stroke-width="1.4" rx="9" />
  <text x="416" y="172.9" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">R (right)</text>
