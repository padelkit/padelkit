  <text x="612" y="227" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Server: B1 (Right) | Deuce Recv: A1 (Right)</text>
  <rect x="598" y="258" width="320" height="58" fill="#f8fafc" stroke="#059669" stroke-width="1.4" rx="8" />
  <text x="612" y="278" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 3 (total_games=2) -&gt; Team A</text>
  <text x="612" y="299" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Server: A2 (Left) | Deuce Recv: B1 (Right)</text>
  <rect x="598" y="330" width="320" height="58" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4" rx="8" />
  <text x="612" y="350" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 4 (total_games=3) -&gt; Team B</text>
  <text x="612" y="371" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Server: B2 (Left) | Deuce Recv: A1 (Right)</text>
</svg>
