<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" role="img">
  <title>PadelKit Serving Geometry &amp; 4-Game Rotation Cycle (ServingEngine)</title>
  <desc>2D court serving quadrants (Deuce right vs Ad left) and 4-game server rotation computed by ServingEngine.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#e11d48" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="14" />
  <text x="28" y="27" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle">Serving Geometry &amp; 4-Game Rotation State Machine (ServingEngine)</text>
  <text x="28" y="47" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">Even points (0, 2, 4...): court_side = 'right' (Deuce)  |  Odd points (1, 3, 5...): court_side = 'left' (Ad)</text>
  <rect x="24" y="64" width="540" height="352" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <rect x="580" y="64" width="356" height="352" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="10" />
  <rect x="64" y="124" width="440" height="220" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
