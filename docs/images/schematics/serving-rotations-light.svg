  <rect x="385.4" y="286.6" width="61.2" height="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.4" rx="9" />
  <text x="416" y="296.1" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">R (left)</text>
  <text x="598" y="92" fill="#09090b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle">4-Game ServingEngine Rotation Cycle</text>
  <rect x="598" y="114" width="320" height="58" fill="#f8fafc" stroke="#059669" stroke-width="1.4" rx="8" />
  <text x="612" y="134" fill="#059669" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 1 (total_games=0) -&gt; Team A</text>
  <text x="612" y="155" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500" text-anchor="start" dominant-baseline="middle">Server: A1 (Right) | Deuce Recv: B1 (Right)</text>
  <rect x="598" y="186" width="320" height="58" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4" rx="8" />
