<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" role="img">
  <title>PadelKit Serving Geometry &amp; 4-Game Rotation Cycle (ServingEngine)</title>
  <desc>2D court serving quadrants (Deuce right vs Ad left) and 4-game server rotation computed by ServingEngine.</desc>
  <defs>
    <marker id="arrow-fg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#f8fafc" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#34d399" />
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-tertiary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#fb7185" />
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#090d16" stroke="#1e293b" stroke-width="1.5" rx="14" />
  <text x="28" y="27" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle">Serving Geometry &amp; 4-Game Rotation State Machine (ServingEngine)</text>
  <text x="28" y="47" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">Even points (0, 2, 4...): court_side = 'right' (Deuce)  |  Odd points (1, 3, 5...): court_side = 'left' (Ad)</text>
  <line x1="572" y1="68" x2="572" y2="412" stroke="#1e293b" stroke-width="1" stroke-linecap="round" />
  <text x="174" y="112" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">SERVING HALF</text>
  <text x="284" y="112" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">NET (0.88m)</text>
  <text x="394" y="112" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="middle">RECEIVING HALF</text>
  <rect x="64" y="134" width="440" height="220" fill="#111c2d" stroke="#f8fafc" stroke-width="2" />
  <rect x="284" y="134" width="154" height="110" fill="#34d399" stroke="none" stroke-width="1" opacity="0.2" />
  <rect x="284" y="244" width="154" height="110" fill="#38bdf8" stroke="none" stroke-width="1" opacity="0.2" />
  <line x1="130" y1="134" x2="130" y2="354" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="438" y1="134" x2="438" y2="354" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="130" y1="244" x2="438" y2="244" stroke="#f8fafc" stroke-width="1.6" stroke-linecap="round" />
  <line x1="284" y1="128" x2="284" y2="360" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="4 3" />
  <text x="358.8" y="152" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">Deuce Box (0, 2, 4)</text>
  <text x="358.8" y="336" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">Ad Box (1, 3, 5)</text>
  <line x1="108" y1="305.6" x2="357.2" y2="197.6" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-primary)" />
  <circle cx="363.2" cy="195.6" r="5.5" fill="#090d16" stroke="#34d399" stroke-width="2" />
  <line x1="108" y1="305.6" x2="120" y2="327.6" stroke="#34d399" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="108" cy="305.6" r="3.2" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
  <rect x="86.2" y="318.6" width="67.6" height="18" fill="#090d16" stroke="#34d399" stroke-width="1.4" rx="9" />
  <text x="120" y="328.1" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">S (right)</text>
  <rect x="417.4" y="177.8" width="67.6" height="18" fill="#090d16" stroke="#34d399" stroke-width="1.4" rx="9" />
  <text x="451.2" y="187.3" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">R (right)</text>
  <line x1="108" y1="182.4" x2="357.2" y2="290.4" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-secondary)" />
  <circle cx="363.2" cy="292.4" r="5.5" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
  <line x1="108" y1="182.4" x2="120" y2="160.4" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.8" />
  <circle cx="108" cy="182.4" r="3.2" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
  <rect x="89.4" y="151.4" width="61.2" height="18" fill="#090d16" stroke="#38bdf8" stroke-width="1.4" rx="9" />
  <text x="120" y="160.9" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">S (left)</text>
  <rect x="420.6" y="292.2" width="61.2" height="18" fill="#090d16" stroke="#38bdf8" stroke-width="1.4" rx="9" />
  <text x="451.2" y="301.7" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.8" font-weight="700" text-anchor="middle" dominant-baseline="middle">R (left)</text>
  <text x="284" y="384" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.2" font-weight="500" text-anchor="middle" dominant-baseline="middle">First bounce must land inside diagonally opposite service box</text>
  <text x="598" y="88" fill="#f4f4f5" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle">4-Game ServingEngine Rotation Cycle</text>
  <rect x="598" y="108" width="290" height="52" fill="#0f172a" stroke="#34d399" stroke-width="1.4" rx="8" />
  <text x="610" y="126" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 1 (games=0) -&gt; Team A</text>
  <text x="610" y="145" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="500" text-anchor="start" dominant-baseline="middle">Srv: A1 (Right) | Recv: B1 (Right)</text>
  <line x1="743" y1="161" x2="743" y2="177" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <rect x="598" y="180" width="290" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" rx="8" />
  <text x="610" y="198" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 2 (games=1) -&gt; Team B</text>
  <text x="610" y="217" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="500" text-anchor="start" dominant-baseline="middle">Srv: B1 (Right) | Recv: A1 (Right)</text>
  <line x1="743" y1="233" x2="743" y2="249" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <rect x="598" y="252" width="290" height="52" fill="#0f172a" stroke="#34d399" stroke-width="1.4" rx="8" />
  <text x="610" y="270" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 3 (games=2) -&gt; Team A</text>
  <text x="610" y="289" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="500" text-anchor="start" dominant-baseline="middle">Srv: A2 (Left) | Recv: B1 (Right)</text>
  <line x1="743" y1="305" x2="743" y2="321" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow-muted)" />
  <rect x="598" y="324" width="290" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4" rx="8" />
  <text x="610" y="342" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.2" font-weight="700" text-anchor="start" dominant-baseline="middle">Game 4 (games=3) -&gt; Team B</text>
  <text x="610" y="361" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="500" text-anchor="start" dominant-baseline="middle">Srv: B2 (Left) | Recv: A1 (Right)</text>
  <polyline points="888,350 912,350 912,134 892,134" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arrow-primary)" />
  <text x="743" y="398" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="600" text-anchor="middle" dominant-baseline="middle">Repeats modulo 4 every 4 games</text>
</svg>
